<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="washGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#washGrad)" />

  <!-- Inner subtle glow frame -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" />

  <!-- Water bubbles / sparkles -->
  <circle cx="130" cy="120" r="14" fill="#FFFFFF" fill-opacity="0.4" />
  <circle cx="380" cy="110" r="22" fill="#FFFFFF" fill-opacity="0.35" />
  <circle cx="340" cy="160" r="10" fill="#FFFFFF" fill-opacity="0.5" />
  <circle cx="170" cy="150" r="8" fill="#FFFFFF" fill-opacity="0.6" />

  <!-- Star sparkle -->
  <path d="M 390 100 Q 390 120 410 120 Q 390 120 390 140 Q 390 120 370 120 Q 390 120 390 100 Z" fill="#FFFFFF" />
  <path d="M 120 180 Q 120 195 135 195 Q 120 195 120 210 Q 120 195 105 195 Q 120 195 120 180 Z" fill="#FFFFFF" opacity="0.8" />

  <!-- Car outline & silhouette in white & clean styling -->
  <g filter="url(#glow)">
    <!-- Car body top roof -->
    <path d="M168 250 C185 205 210 190 256 190 C302 190 327 205 344 250 L395 265 C415 272 426 288 426 310 L426 348 C426 358 418 366 408 366 L396 366 C396 384 382 398 364 398 C346 398 332 384 332 366 L180 366 C180 384 166 398 148 398 C130 398 116 384 116 366 L104 366 C94 366 86 358 86 348 L86 310 C86 288 97 272 117 265 Z" fill="#FFFFFF" />

    <!-- Windshield -->
    <path d="M182 250 C194 216 214 204 256 204 C298 204 318 216 330 250 Z" fill="url(#carGrad)" />

    <!-- Headlights -->
    <rect x="108" y="296" width="36" height="14" rx="7" fill="#FDE047" />
    <rect x="368" y="296" width="36" height="14" rx="7" fill="#FDE047" />

    <!-- Car grille -->
    <rect x="190" y="300" width="132" height="18" rx="6" fill="#E2E8F0" />
    <line x1="220" y1="300" x2="220" y2="318" stroke="#94A3B8" stroke-width="2" />
    <line x1="256" y1="300" x2="256" y2="318" stroke="#94A3B8" stroke-width="2" />
    <line x1="292" y1="300" x2="292" y2="318" stroke="#94A3B8" stroke-width="2" />

    <!-- Wheels -->
    <circle cx="148" cy="366" r="26" fill="#1E1B4B" />
    <circle cx="148" cy="366" r="12" fill="#E2E8F0" />
    <circle cx="364" cy="366" r="26" fill="#1E1B4B" />
    <circle cx="364" cy="366" r="12" fill="#E2E8F0" />
  </g>

  <!-- Water spray / swoosh curve at bottom -->
  <path d="M 90 425 Q 256 460 422 425 Q 256 440 90 425 Z" fill="#A5F3FC" opacity="0.8" />
</svg>
